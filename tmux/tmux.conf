# Terminal & colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# General
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Key bindings
# Intuitive splits (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Vi copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# Pane borders
# Visible on light background: inactive grey, active dark blue
set -g pane-border-style "fg=colour250"
set -g pane-active-border-style "fg=colour24,bold"

# Active pane: white background; inactive panes: terminal default
set -g window-style "fg=default,bg=default"
set -g window-active-style "fg=default,bg=colour230"

# Status bar
set -g status-position top
set -g status-interval 5

set -g status-style "fg=colour236,bg=colour224"

set -g status-left-length 30
set -g status-left "#[bold]#S#[nobold]  "

set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#[bold,bg=colour24,fg=white] #I:#W#F #[default]"
set -g window-status-activity-style "fg=colour166"

set -g status-right-length 50
set -g status-right "[%A %d %b %y - W%U - %H:%M]"

# Copy mode highlight
set -g mode-style "fg=white,bg=colour24"
